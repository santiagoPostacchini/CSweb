// Configuración base del servidor dedicado (CS 1.6 / ReGameDLL_CS).
// hostname, rcon_password y sv_password se toman de config.json.
// Para tus propios ajustes usá custom.cfg (se ejecuta al final).

sv_lan 1
pausable 0
sv_aim 0
sv_cheats 0
sv_allowupload 0
sv_allowdownload 1
allow_spectators 1
// segundos sin respuesta antes de desconectar a un jugador
sv_timeout 120

// Red: valores pensados para LAN
sys_ticrate 250
sv_maxrate 100000
sv_minrate 25000
sv_maxupdaterate 101
sv_minupdaterate 30

// Reglas de juego
mapcyclefile mapcycle.txt
mp_timelimit 30
mp_roundtime 2.5
mp_freezetime 3
mp_buytime 0.75
mp_c4timer 35
mp_startmoney 800
mp_friendlyfire 0
mp_autoteambalance 1
mp_limitteams 2
mp_autokick 0
mp_flashlight 1
mp_footsteps 1

// Bots YaPB (se agregan con "yb add" o con "bots" en config.json)
yb_join_after_player 0
yb_quota_mode "normal"

exec listip.cfg
exec banned.cfg
